name: Design problem
description: An assumption or decision (ADR) turned out to be wrong or insufficient
labels: [design]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is (or will be) public.** Describe the problem in purely technical terms.
        Do not include images, videos, locations, street names, license plates or anything that could identify
        a place, person or vehicle.
  - type: input
    id: adr
    attributes:
      label: Affected ADR(s)
      placeholder: e.g. ADR-0009
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which assumption does not hold, and what are the consequences?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Possible solutions
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no images, videos, locations, plates or other information that could identify a place, person or vehicle, and does not reference any private resource.
          required: true
