name: Bug
description: A defect that affects counting results, stability or performance
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is (or will be) public.** Describe the problem in purely technical terms.
        Do not include images, videos, locations, street names, license plates or anything that could identify
        a place, person or vehicle. Reproduce with synthetic data, unit tests or generic descriptions.
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Synthetic input, failing test or generic scenario (e.g. "vehicle occluded for 1.5 s while crossing the line").
  - type: dropdown
    id: data-impact
    attributes:
      label: Impact on stored counting data
      options:
        - None
        - New data affected
        - Already stored data affected
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no images, videos, locations, plates or other information that could identify a place, person or vehicle, and does not reference any private resource.
          required: true
